name: Web CI

on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Static, domain and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      DATABASE_URL: file:./e2e.db
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: npm ci
      - run: npm run test:e2e:prepare
      - run: npm run check:static
      - run: npm run typecheck
      - run: npm test
      - name: Validate production security configuration
        run: npm run check:production-config
        env:
          DATABASE_URL: postgresql://ary:test@db.invalid/ary
          GITHUB_CLIENT_ID: ci-client
          GITHUB_CLIENT_SECRET: ci-secret
          NEXT_PUBLIC_APP_URL: https://ary.example.test
          ENABLE_DEBUG_LOGIN: "false"
          DEFAULT_CA_CONNECTOR_ID: ci-connector
          CA_CONNECTOR_KEYS: '{"ci-connector":{"keyId":"ci-key","secret":"01234567890123456789012345678901"}}'
      - run: npm run prisma:generate
      - run: npm run build
        env:
          DATABASE_URL: postgresql://ary:test@db.invalid/ary

  browser-e2e:
    name: Playwright browser E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
          retention-days: 7
